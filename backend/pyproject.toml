[project]
name = "caloric_restriction"
version = "0.1.0"
description = "Caloric Restriction Project - GEO Survival Analysis"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.28.1",
    "numpy>=2.3.4",
    "pandas==2.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=1.14.0",
    "scipy>=1.16.3",
    "statsmodels>=0.14.5",
    "lifelines>=0.29.0",
    "python-pptx>=1.0.2",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    # LangChain for chat
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-postgres>=0.0.12",
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.3.0",
    "alembic>=1.18.1",
    "click>=8.1.0",
    "psycopg2-binary>=2.9.0",  # For schema inspection
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
