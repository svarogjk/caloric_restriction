[project]
name = "caloric_restriction"
version = "0.1.0"
description = "Caloric Restriction Project - GEO Survival Analysis"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.28.1",
    "numpy>=2.3.4",
    "pandas==2.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=1.14.0",
    "scipy>=1.16.3",
    "statsmodels>=0.14.5",
    "lifelines>=0.29.0",
    "python-pptx>=1.0.2",
    "psutil>=5.9.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # AI / LLM
    "mistralai>=1.5.0",
    "anthropic>=0.40.0",
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.3.0",
    "alembic>=1.18.1",
    "click>=8.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
