services:
  app:
    image: ghcr.io/svarogjk/geo-survival-analysis:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/geo_chat.db
    volumes:
      - app_data:/app/data
      - app_datasets:/app/datasets
      - app_platform_mappings:/app/platform_mappings
      - app_logs:/app/geo_logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  app_datasets:
  app_platform_mappings:
  app_logs:
  caddy_data:
  caddy_config:
